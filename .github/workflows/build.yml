name: Build APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: 'Which ABIs to build (all = 32-bit + 64-bit; arm64 = 64-bit only, faster for quick tests)'
        type: choice
        options:
          - all
          - arm64
        default: all
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # v3 intenta instalar el paquete obsoleto "tools", que Google retiró.
      # v4 corrige ese problema. Especificamos platform-tools explícitamente.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android platform, build tools and NDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --version

          # Reintentar si la descarga del NDK llega incompleta o corrupta.
          for attempt in 1 2 3; do
            echo "Instalación del SDK/NDK: intento $attempt de 3"
            if sdkmanager --install \
              "platform-tools" \
              "platforms;android-34" \
              "build-tools;34.0.0" \
              "ndk;26.1.10909125"; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "No se pudo instalar el NDK después de 3 intentos." >&2
              exit 1
            fi

            # Eliminar solo la carpeta de la versión de NDK incompleta.
            rm -rf "$ANDROID_HOME/ndk/26.1.10909125"
            sleep 5
          done

      - name: Prepare project (download SDL2 and Saturn)
        shell: bash
        run: bash ./setup.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          # setup.sh descarga SDL2, que incluye un wrapper que no se usa
          # para compilar este proyecto. Gradle se ejecuta instalado (gradle ...).
          validate-wrappers: false

      - name: Install ccache
        shell: bash
        run: sudo apt-get install -y ccache

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Build debug APK
        shell: bash
        env:
          NDK_CCACHE: /usr/bin/ccache
          CCACHE_DIR: /home/runner/.ccache
          CCACHE_MAXSIZE: 1G
          CCACHE_COMPILERCHECK: string:ndk-26.1.10909125
          CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros
        run: |
          if [ "${{ inputs.abi }}" = "arm64" ]; then
            gradle assembleDebug --no-daemon --stacktrace -PonlyArm64
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi
          ccache -s || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: saturn-android-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
