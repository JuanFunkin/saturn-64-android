name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # v3 intenta instalar el paquete obsoleto "tools", que Google retiró.
      # v4 corrige ese problema. Especificamos platform-tools explícitamente.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android platform, build tools and NDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --version

          # Reintentar si la descarga del NDK llega incompleta o corrupta.
          for attempt in 1 2 3; do
            echo "Instalación del SDK/NDK: intento $attempt de 3"
            if sdkmanager --install \
              "platform-tools" \
              "platforms;android-34" \
              "build-tools;34.0.0" \
              "ndk;26.1.10909125"; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "No se pudo instalar el NDK después de 3 intentos." >&2
              exit 1
            fi

            # Eliminar solo la carpeta de la versión de NDK incompleta.
            rm -rf "$ANDROID_HOME/ndk/26.1.10909125"
            sleep 5
          done

      - name: Prepare project (download SDL2 and Saturn)
        shell: bash
        run: bash ./setup.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          # setup.sh descarga SDL2, que incluye un wrapper que no se usa
          # para compilar este proyecto. Gradle se ejecuta instalado (gradle ...).
          validate-wrappers: false

      - name: Build debug APK
        shell: bash
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: saturn-android-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
